<meta name="description" content="Plan swim lesson coverage from a saved PIVVIT roster. Everything stays in your browser.">
<title>Lesson coverage · Aquatics Studio</title>
<link rel="stylesheet" href="./studio.css?v=1">

  .lesson { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="app">

</div>
<input type="file" id="fileInput" accept=".html,.htm,.xlsx,text/html" hidden multiple>

<script>

  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  xCircle: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',

const icon = (name, extra = '') => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"${extra}>${ICONS[name]}</svg>`;

/* =========================================================================
   PIVVIT roster parser
   ========================================================================= */
function parseDateHuman(s, year = new Date().getFullYear()) {
  const m = norm(s).match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s*(\d{1,2})(?:,?\s+(20\d{2}))?/i);

// PIVVIT renders every state in a cell and hides inactive ones with inline display:none.
function shownIn(el, cell) {

}
function iconStatus(td) {

  const icons = Array.from(td.querySelectorAll('svg[data-icon]')).filter(x => shownIn(x, td));
  const has = (name, cls) => icons.some(x => x.getAttribute('data-icon') === name && (!cls || x.classList.contains(cls)));
  if (icons.some(x => x.getAttribute('data-icon') === 'square' && (x.getAttribute('data-prefix') === 'fas' || (x.id || '').includes('class-canceled')))) return 'nonrunning';
  if (has('flag') || Array.from(td.querySelectorAll('i.bi-flag-fill, i.bi-flag')).some(x => shownIn(x, td))) return 'flagged';

  if (has('check')) return 'present';
  if (Array.from(td.querySelectorAll('button.orange-btn')).some(x => shownIn(x, td))) return 'pending';

/* =========================================================================
   Shift file parser (Life Time Excel export) — swim instructors only.

   ========================================================================= */

/* =========================================================================
   Model
   ========================================================================= */
const isAssessment = t => /assessment/i.test(t);
const isPrivate = t => /private/i.test(t);
const isMergeable = t => !/(private|assessment|try.?out|masters|clinic|team|camp|stroke|semi)/i.test(t);
const lessonKey = c => [c.title, c.start, c.end, c.instructor].join('|');
const normName = s => String(s || '').toLowerCase().replace(/[^a-z\s'-]/g, ' ').replace(/\s+/g, ' ').trim();
function sameName(a, b) {
  const x = normName(a), y = normName(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const xs = x.split(' '), ys = y.split(' ');
  return xs[0] === ys[0] && xs[xs.length - 1] === ys[ys.length - 1];
}

const PREFS_KEY = 'aquatics-coverage-prefs';
function readPrefs() { try { const p = JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; return { prefer: p.prefer === 'merge' ? 'merge' : 'sub', emptyFree: p.emptyFree !== false }; } catch { return { prefer: 'sub', emptyFree: true }; } }
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify({ prefer: state.prefer, emptyFree: state.emptyFree })); } catch {} }

const state = {
  roster: null,      // { classes, dates, notices, fileName, savedAt }
  shifts: null,      // { byDate, dates, count, fileName }
  day: '',
  out: {},           // date -> Set of instructor names marked out
  pins: {},          // date -> { lessonId: optionKey | 'none' }
  siteEdits: {},     // date -> { name: { here, start, end } }
  verifiedAll: {},   // date -> true when the user confirmed all capacities
  highlight: new Set(),
  editing: null,
  ...readPrefs()
};

function lessonForDate(c, date) {
  const obs = c.observations[date], ov = c.overrides[date] || {};
  const expected = ov.expected ?? obs?.expected ?? c.registered ?? 0;
  const capacity = 'capacity' in ov ? ov.capacity : c.capacity;
  const tally = obs?.tally || { present: 0, pending: 0, flagged: 0, excused: 0, notEnrolled: 0 };
  return {
    id: c.id, key: lessonKey(c), title: c.title, instructor: c.instructor, start: c.start, end: c.end,
    expected, capacity, capacityDate: c.capacityDate,
    capacityValid: !!(ov.capacityVerified || state.verifiedAll[date] || c.capacityDate === date),
    capacityVerified: !!ov.capacityVerified,
    canceled: ov.canceled ?? obs?.nonrunning ?? false,
    out: tally.flagged + tally.excused, tally, ambiguous: obs?.ambiguous || 0,
    teacherStatus: obs?.teacher || 'unknown', manual: Object.keys(ov).length > 0,
    assessment: isAssessment(c.title), private: isPrivate(c.title), mergeable: isMergeable(c.title)
  };
}
// Empty assessment slots are not lessons: they are hidden and never block an instructor.
function dailyLessons(date = state.day) {
  if (!state.roster) return [];
  return state.roster.classes.filter(c => c.observations[date]).map(c => lessonForDate(c, date)).filter(l => !(l.assessment && l.expected === 0));
}

function dayModel(date = state.day) {
  const lessons = dailyLessons(date);
  const active = lessons.filter(l => !l.canceled);
  const shiftDay = state.shifts && state.shifts.byDate[date] ? state.shifts.byDate[date] : null;
  const named = shiftDay ? shiftDay.filter(s => !s.open) : [];
  const openShifts = shiftDay ? shiftDay.filter(s => s.open) : [];
  const people = new Map();
  for (const l of lessons) {
    if (!people.has(l.instructor)) people.set(l.instructor, { name: l.instructor, lessons: [], shifts: [] });
    people.get(l.instructor).lessons.push(l);
  }
  for (const s of named) {
    let p = [...people.values()].find(x => sameName(x.name, s.name));
    if (!p) { p = { name: s.name, lessons: [], shifts: [] }; people.set(s.name, p); }
    p.shifts.push([s.start, s.end]);
  }
  const list = [...people.values()].map(p => {
    const act = p.lessons.filter(l => !l.canceled).sort((a, b) => a.start - b.start);
    return { ...p, active: act, first: act.length ? act[0].start : null, last: act.length ? Math.max(...act.map(l => l.end)) : null, noShift: !!shiftDay && !p.shifts.length };
  }).sort((a, b) => (a.active.length ? 0 : 1) - (b.active.length ? 0 : 1) || (a.first ?? 9999) - (b.first ?? 9999) || a.name.localeCompare(b.name));
  return { date, lessons, active, people: list, shiftLoaded: !!state.shifts, shiftDay: !!shiftDay, openShifts };
}

// Where each instructor can be, as time intervals, and where that came from.
function windowsFor(model) {
  const edits = state.siteEdits[model.date] || {};
  const out = {};
  for (const p of model.people) {
    const e = edits[p.name];
    if (e) { out[p.name] = { here: e.here, intervals: e.here ? [[e.start, e.end]] : [], source: 'edited' }; continue; }
    if (p.shifts.length) out[p.name] = { here: true, intervals: p.shifts.slice(), source: 'shift' };
    else if (model.shiftDay) out[p.name] = { here: p.active.length > 0, intervals: p.active.map(l => [l.start, l.end]), source: 'lessons-only' };
    else out[p.name] = { here: p.active.length > 0, intervals: p.first != null ? [[p.first, p.last]] : [], source: 'estimate' };
  }
  return out;
}

/* =========================================================================
   Coverage planner
   ========================================================================= */
const SEARCH_LIMIT = 180000;

function planCoverage({ lessons, out, windows, prefer = 'sub', emptyFree = true, pins = {}, experience = () => false, shiftDay = false }) {
  const P = prefer === 'merge' ? 'merge' : 'sub';
  const active = lessons.filter(l => !l.canceled);
  const affected = active.filter(l => out.has(l.instructor) && l.expected > 0).sort((a, b) => a.start - b.start || a.title.localeCompare(b.title));
  const zero = active.filter(l => out.has(l.instructor) && l.expected === 0);
  const others = active.filter(l => !out.has(l.instructor));
  const covers = (name, s, e) => (windows[name]?.intervals || []).some(([a, b]) => a <= s && b >= e);
  const busy = (name, s, e) => others.some(x => x.instructor === name && overlaps(x.start, x.end, s, e) && (!emptyFree || x.expected > 0));
  const candidates = Object.keys(windows).filter(n => !out.has(n) && windows[n].here);

  const options = affected.map(task => {
    const list = [];
    for (const name of candidates) {
      if (!covers(name, task.start, task.end) || busy(name, task.start, task.end)) continue;
      list.push({ key: 'sub:' + name, type: 'sub', name, levelExperience: experience(name, task.title), source: windows[name].source, interval: windows[name].intervals.find(([a, b]) => a <= task.start && b >= task.end) });
    }
    if (task.mergeable) for (const host of others) {
      if (!host.mergeable || host.title.toLowerCase() !== task.title.toLowerCase() || host.start !== task.start || host.end !== task.end || host.expected === 0) continue;
      if (windows[host.instructor] && !windows[host.instructor].here) continue;
      if (!Number.isFinite(host.capacity)) continue;
      const available = host.capacity - host.expected;
      if (available < task.expected) continue;
      list.push({ key: 'merge:' + host.id, type: 'merge', name: host.instructor, hostId: host.id, host, capacityValid: host.capacityValid, available });
    }
    return { task, options: list };
  });

  // Rank substitutes. First: who can cover the most of these lessons on their own.
  // Tie: who has had fewer kids so far (their own classes that end before the first lesson
  // they would take over). Last: name, so results are stable.
  const canCover = {}, kidsSoFar = {};
  for (const name of candidates) {
    const mine = options.filter(o => o.options.some(x => x.type === 'sub' && x.name === name)).map(o => o.task).sort((a, b) => a.end - b.end);
    let n = 0, lastEnd = -Infinity;
    for (const t of mine) if (t.start >= lastEnd) { n++; lastEnd = t.end; }
    canCover[name] = n;
    const firstStart = mine.length ? Math.min(...mine.map(t => t.start)) : Infinity;
    kidsSoFar[name] = others.filter(x => x.instructor === name && x.end <= firstStart).reduce((a, x) => a + x.expected, 0);
  }
  const ranked = candidates.filter(n => canCover[n] > 0).sort((a, b) => canCover[b] - canCover[a] || kidsSoFar[a] - kidsSoFar[b] || a.localeCompare(b));
  const rank = Object.fromEntries(ranked.map((n, i) => [n, i]));
  for (const o of options) {
    o.options.sort((a, b) => (a.type === P ? 0 : 1) - (b.type === P ? 0 : 1)
      || (a.type === 'sub' && b.type === 'sub' ? rank[a.name] - rank[b.name] : 0)
      || (b.capacityValid ? 1 : 0) - (a.capacityValid ? 1 : 0)
      || a.name.localeCompare(b.name));
    o.options.forEach(x => { if (x.type === 'sub') { x.canCover = canCover[x.name]; x.kidsSoFar = kidsSoFar[x.name]; } });
  }

  // Best plan, compared in this order:
  //   1. most lessons covered  2. most with confirmed capacity  3. most of the preferred kind (sub or merge)
  //   4. as many lessons as possible to the top-ranked substitute, then the next, and so on.
  const better = (a, b) => { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return a[k] > b[k]; return false; };
  let best = null, visits = 0, truncated = false;
  const chosen = [], subsBusy = [], merged = {};
  function recurse(i, covered) {
    if (visits++ > SEARCH_LIMIT) { truncated = true; return; }
    if (i === options.length) {
      const counts = new Array(ranked.length).fill(0);
      let confirmed = 0, pref = 0;
      for (const p of chosen) if (p) {
        if (p.type === 'sub' || p.capacityValid) confirmed++;
        if (p.type === P) pref++;
        if (p.type === 'sub') counts[rank[p.name]]++;
      }
      const v = [covered, confirmed, pref, ...counts];
      if (!best || better(v, best.v)) best = { v, picks: chosen.slice() };
      return;
    }
    if (best && covered + (options.length - i) < best.v[0]) return;
    const { task, options: opts } = options[i];
    const pin = pins[task.id];
    const tryOpts = pin === 'none' ? [] : (pin && opts.some(o => o.key === pin) ? opts.filter(o => o.key === pin) : opts);
    for (const o of tryOpts) {
      if (o.type === 'sub' && subsBusy.some(x => x.name === o.name && overlaps(x.start, x.end, task.start, task.end))) continue;
      if (o.type === 'merge' && (merged[o.hostId] || 0) + task.expected > o.available) continue;
      if (o.type === 'sub') subsBusy.push({ name: o.name, start: task.start, end: task.end }); else merged[o.hostId] = (merged[o.hostId] || 0) + task.expected;
      chosen.push(o);
      recurse(i + 1, covered + 1);
      chosen.pop();
      if (o.type === 'sub') subsBusy.pop(); else merged[o.hostId] -= task.expected;
    }
    // Leaving a lesson uncovered is always a possible branch, so a pinned choice that
    // conflicts with another pin never wipes out the whole plan.
    chosen.push(null); recurse(i + 1, covered); chosen.pop();
  }
  recurse(0, 0);
  if (!best) best = { picks: options.map(() => null) };

  const results = options.map(({ task, options: opts }, i) => {
    const pick = best.picks[i] || null;
    const status = !pick ? 'none' : pick.type === 'sub' ? 'sub' : pick.capacityValid ? 'merge' : 'review';
    return { task, pick, status, options: opts, pinned: task.id in pins, reason: pick ? '' : explain(task, opts, i) };
  });

  function explain(task, opts, i) {
    if (pins[task.id] === 'none') return 'You chose to leave this uncovered.';
    if (opts.length) {
      const taken = opts.filter(o => o.type === 'sub').map(o => {
        const j = best.picks.findIndex((p, k) => k !== i && p && p.type === 'sub' && p.name === o.name && overlaps(options[k].task.start, options[k].task.end, task.start, task.end));
        return j >= 0 ? `${o.name} is already covering ${options[j].task.title} at ${clockText(options[j].task.start)}` : '';
      }).filter(Boolean);
      return (taken[0] || 'Every option is already used elsewhere in this plan') + '.';
    }
    const parts = [];
    const onSite = candidates.filter(n => covers(n, task.start, task.end));
    if (!onSite.length) parts.push(shiftDay ? `no swim instructor's shift covers ${range(task.start, task.end)}` : `no one else is on site for all of ${range(task.start, task.end)}`);
    else parts.push(onSite.length === 1 ? `${onSite[0]} is teaching then` : `all ${onSite.length} instructors on site are teaching then`);
    if (task.private) parts.push("private lessons can't be merged");
    else if (!task.mergeable) parts.push("this class type isn't merged automatically");
    else {
      const same = others.filter(x => x.title.toLowerCase() === task.title.toLowerCase() && x.start === task.start && x.end === task.end);
      if (!same.length) parts.push(`no other ${task.title} runs at ${clockText(task.start)}`);
      else {
        const x = same[0];
        const spare = Number.isFinite(x.capacity) ? Math.max(0, x.capacity - x.expected) : null;
        parts.push(spare === null ? `${x.instructor}'s ${task.title} has no capacity listed` : spare === 0 ? `${x.instructor}'s ${task.title} is full` : `${x.instructor}'s ${task.title} only has ${plural(spare, 'open seat')}`);
      }
    }
    const s = parts.length === 2 ? parts.join(', and ') : parts.join(', ');
    return s.charAt(0).toUpperCase() + s.slice(1) + '.';
  }
  return { results, zero, truncated, visits };
}

function currentPlan(model) {
  const out = state.out[model.date];
  if (!out || !out.size) return null;
  const windows = windowsFor(model);
  const exp = (name, title) => state.roster.classes.some(c => sameName(c.instructor, name) && c.title.toLowerCase() === title.toLowerCase());
  return { windows, ...planCoverage({ lessons: model.lessons, out, windows, prefer: state.prefer, emptyFree: state.emptyFree, pins: state.pins[model.date] || {}, experience: exp, shiftDay: model.shiftDay }) };
}

/* =========================================================================
   "Needs a look" — things in the roster worth checking
   ========================================================================= */
function attentionItems(model) {
  const items = [], date = model.date, outSet = state.out[date] || new Set();
  const nameList = arr => arr.length <= 2 ? arr.join(' and ') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];
  if (state.roster.notices.length) items.push({ tone: 'warn', title: `${state.roster.notices[0]} earlier classes were collapsed when you saved`, body: 'Expand "Show passed classes" in PIVVIT and save again if you need them.' });
  for (const p of model.people) {
    if (outSet.has(p.name) || !p.active.length) continue;
    if (p.active.some(l => l.teacherStatus === 'flagged' || l.teacherStatus === 'excused')) items.push({ tone: 'warn', title: `${p.name} is marked absent in PIVVIT`, body: 'Mark them out to plan coverage for their lessons.', ids: p.active.map(l => l.id), action: { label: 'Mark out', type: 'out', name: p.name } });
  }
  for (const p of model.people) {
    const act = p.active;
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const a = act[i], b = act[j];
      if (!overlaps(a.start, a.end, b.start, b.end)) continue;
      const same = a.title === b.title;
      items.push({ tone: 'warn', title: same ? `${p.name} has two ${a.title} classes at ${clockText(a.start)}` : `${p.name} has overlapping lessons at ${clockText(Math.max(a.start, b.start))}`, body: same ? `${plural(a.expected + b.expected, 'kid')} between them. Two lanes, or a double booking?` : `${a.title} (${range(a.start, a.end)}) and ${b.title} (${range(b.start, b.end)}).`, ids: [a.id, b.id] });
    }
  }
  if (model.shiftDay) {
    const noShift = model.people.filter(p => p.noShift && p.active.length);
    for (const p of noShift) items.push({ tone: 'warn', title: `${p.name} has ${plural(p.active.length, 'lesson')} but no shift in your schedule file`, body: `They aren't listed as a swim instructor on ${dateShort(date)}. Confirm they're working.`, ids: p.active.map(l => l.id) });
    for (const p of model.people) {
      if (!p.shifts.length) continue;
      for (const l of p.active) {
        const inside = p.shifts.some(([a, b]) => a <= l.start && b >= l.end);
        if (inside) continue;
        const s = p.shifts[0];
        items.push({ tone: 'warn', title: l.start < s[0] ? `${p.name}'s ${clockText(l.start)} ${l.title} starts before their ${clockText(s[0])} shift` : `${p.name}'s ${clockText(l.start)} ${l.title} runs past their shift`, body: `Shift: ${range(s[0], s[1])}.`, ids: [l.id] });
      }
    }
  }
  const emptied = model.active.filter(l => l.expected === 0 && l.out > 0);
  if (emptied.length) items.push({ tone: 'info', title: `${plural(emptied.length, 'class has', 'classes have')} no kids left after absences`, body: nameList(emptied.map(l => `${l.instructor.split(' ')[0]}'s ${l.title} at ${clockShort(l.start)}`)) + (state.emptyFree ? '. Those instructors are free then.' : '.'), ids: emptied.map(l => l.id) });
  const lone = model.active.filter(l => !l.private && !l.assessment && l.expected === 1 && l.out > 0);
  for (const l of lone.slice(0, 3)) items.push({ tone: 'info', title: `${l.instructor.split(' ')[0]}'s ${l.title} at ${clockShort(l.start)} is down to 1 kid`, body: `${l.out} of ${l.out + 1} reported out.`, ids: [l.id] });
  if (lone.length > 3) items.push({ tone: 'info', title: `${lone.length - 3} more classes are down to 1 kid`, body: 'Check the board for classes with one filled dot.', ids: lone.slice(3).map(l => l.id) });
  if (model.openShifts.length) items.push({ tone: 'info', title: `${plural(model.openShifts.length, 'open swim instructor shift')} in your schedule file`, body: nameList(model.openShifts.map(s => range(s.start, s.end))) + '. Nobody is assigned yet.' });
  const ambiguous = model.active.reduce((a, l) => a + l.ambiguous, 0);
  if (ambiguous) items.push({ tone: 'info', title: `${plural(ambiguous, 'kid has', 'kids have')} an attendance mark the app doesn't recognize`, body: "They're counted as expected. Check their row in PIVVIT if it matters.", ids: model.active.filter(l => l.ambiguous).map(l => l.id) });
  const staleCaps = model.active.filter(l => !l.capacityValid && l.capacityDate);
  if (staleCaps.length) items.push({ tone: 'warn', title: `${plural(staleCaps.length, 'class capacity is', 'class capacities are')} from another date`, body: `PIVVIT showed them for ${dateShort(staleCaps[0].capacityDate)}. Merges into these classes are marked "check capacity".`, ids: staleCaps.map(l => l.id), action: { label: "I've checked them", type: 'verifyAll' } });
  else if (model.active.length) items.push({ tone: 'ok', title: 'Class capacities are for this date', body: 'Merges can rely on them.' });
  if (!state.shifts) items.push({ tone: 'info', title: 'Add your schedule export for better suggestions', body: "With swim instructor shift times, the planner knows who's on site between lessons.", action: { label: 'Import shifts', type: 'import' } });
  return items;
}

function savedText(ts) {
  if (!ts) return 'saved file';
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? 'saved ' + time : 'saved ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
}

function lessonTile(l, extra) {
  const dots = [];
  for (let i = 0; i < Math.min(l.expected, 24); i++) dots.push('<i class="dot"></i>');
  for (let i = 0; i < Math.min(l.out, 12); i++) dots.push('<i class="dot dot-out"></i>');
  let cls = l.canceled ? 'lesson-out' : l.expected === 0 ? 'lesson-empty' : l.private ? 'lesson-private' : '';
  let note = l.canceled ? 'Canceled or moved' : l.expected === 0 ? (l.out ? `Empty: ${l.out} reported out` : 'No kids') : '';
  let noteStyle = '';
  if (extra) { cls = extra.cls; note = extra.note; noteStyle = extra.noteStyle || ''; }
  if (state.highlight.has(l.id)) cls += ' hl';
  const count = l.assessment ? `${l.expected} booked` : `${l.expected}/${l.capacity ?? '?'}`;
  const label = `${l.title}, ${range(l.start, l.end)}, ${l.instructor}: ${l.expected} expected${l.out ? ', ' + l.out + ' reported out' : ''}${note ? '. ' + note : ''}. Edit`;
  return `<button type="button" class="lesson ${cls}" data-lesson="${h(l.id)}" aria-label="${h(label)}">
    <span class="lesson-top"><span class="lesson-title">${h(l.title)}</span><span class="lesson-count">${h(count)}</span></span>
    ${dots.length ? `<span class="dots" aria-hidden="true">${dots.join('')}</span>` : ''}
    ${l._offTime ? `<span class="lesson-time">Starts ${h(clockShort(l.start))}</span>` : ''}
    ${note ? `<span class="lesson-time" style="${noteStyle}">${h(note)}</span>` : ''}
  </button>`;
}

function slotColumns(lessons) {
  const starts = [...new Set(lessons.map(l => l.start))].sort((a, b) => a - b);
  const cols = [];
  for (const s of starts) {
    const last = cols[cols.length - 1];
    if (last && s - last.first <= 10) last.starts.push(s); else cols.push({ first: s, starts: [s] });
  }
  return cols.map(c => {
    const counts = {};
    lessons.filter(l => c.starts.includes(l.start)).forEach(l => counts[l.start] = (counts[l.start] || 0) + 1);
    const label = +Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
    return { label, starts: c.starts };
  });
}

function renderBoard(model, plan) {
  const cols = slotColumns(model.lessons);
  const outSet = state.out[model.date] || new Set();
  const byTask = {};
  const covering = {};
  if (plan) for (const r of plan.results) {
    byTask[r.task.id] = r;
    if (r.pick && r.pick.type === 'sub') covering[r.pick.name] = (covering[r.pick.name] || 0) + 1;
  }
  const head = `<div class="sg-row" role="row"><div class="sg-head" role="columnheader">Instructor</div>${cols.map((c, i) => `<div class="sg-head" role="columnheader">${h(clockShort(c.label))}${i === 0 || clockText(c.label).slice(-2) !== clockText(cols[i - 1].label).slice(-2) ? ' ' + clockText(c.label).slice(-2) : ''}</div>`).join('')}</div>`;
  const rows = model.people.map(p => {
    const isOut = outSet.has(p.name);
    const kids = p.active.reduce((a, l) => a + l.expected, 0);
    let meta = p.active.length ? `${plural(p.active.length, 'lesson')} · ${plural(kids, 'kid')}` : (p.shifts.length ? 'On shift · no lessons' : 'No lessons');
    let metaStyle = '';
    if (p.noShift && p.active.length) { meta = `${plural(p.active.length, 'lesson')} · no shift on file`; metaStyle = 'color:var(--warn);font-weight:600'; }
    if (covering[p.name]) meta = (p.active.length ? plural(p.active.length, 'lesson') : 'On shift') + ` · covering ${covering[p.name]}`;
    const cells = cols.map(c => {
      const here = p.lessons.filter(l => c.starts.includes(l.start)).sort((a, b) => a.start - b.start);
      return `<div class="sg-cell" role="cell">${here.map(l => {
        l._offTime = l.start !== c.label;
        const r = byTask[l.id];
        if (isOut && !l.canceled) {
          if (l.expected === 0) return lessonTile(l, { cls: 'lesson-empty', note: 'No kids to move' });
          if (r) {
            if (r.status === 'sub') return lessonTile(l, { cls: 'lesson-covered', note: 'To ' + r.pick.name, noteStyle: 'color:var(--ok);font-weight:600' });
            if (r.status === 'merge') return lessonTile(l, { cls: 'lesson-covered', note: 'Merge into ' + r.pick.name, noteStyle: 'color:var(--ok);font-weight:600' });
            if (r.status === 'review') return lessonTile(l, { cls: 'lesson-needs', note: 'Merge, check capacity', noteStyle: 'color:var(--warn);font-weight:600' });
            return lessonTile(l, { cls: 'lesson-uncovered', note: 'Uncovered', noteStyle: 'color:var(--danger);font-weight:600' });
          }
        }
        return lessonTile(l);
      }).join('')}</div>`;
    }).join('');
    const btn = isOut
      ? `<button class="btn btn-sm" type="button" data-out="${h(p.name)}">Undo</button>`
      : (p.active.length ? `<button class="btn btn-ghost btn-sm icon-btn" type="button" data-out="${h(p.name)}" aria-label="Mark ${h(p.name)} out" title="Mark out">${icon('userX')}</button>` : '');
    return `<div class="sg-row${isOut ? ' sg-row-out' : ''}" role="row">
      <div class="sg-name" role="rowheader"><div class="sg-name-top"><strong>${h(p.name)}</strong>${isOut ? '<span class="badge badge-danger">Out</span>' : ''}${btn}</div><small style="${metaStyle}">${h(meta)}</small></div>
      ${cells}</div>`;
  }).join('');
  const legend = plan
    ? '<span><i class="sw" style="background:var(--ok-soft);border:1px solid #bfe0cc"></i>Covered</span><span><i class="sw" style="background:var(--warn-soft);border:1px solid var(--warn-border)"></i>Check capacity</span><span><i class="sw" style="background:var(--danger-soft);border:1px solid var(--danger-border)"></i>Uncovered</span>'
    : '<span><i class="sw" style="background:#eef3f7;border:1px solid #d4e0ea"></i>Private</span><span><i class="sw" style="background:#fff;border:1px dashed var(--border-strong)"></i>No kids</span>';
  return `<section class="panel board-panel" aria-labelledby="board-h">
    <div class="panel-head" style="flex-wrap:wrap">
      <div><h2 id="board-h">Lessons by instructor</h2><div class="panel-sub">${plan ? "Out instructors' lessons show where each class goes." : 'Click a lesson to adjust its count. Use the icon beside a name to mark them out.'}</div></div>
      <div class="legend"><span><i class="dot"></i>Expected</span><span><i class="dot dot-out"></i>Reported out</span>${legend}</div>
    </div>
    <div class="table-wrap"><div class="slotgrid" role="table" aria-label="Lessons by instructor and time" style="--slots:${cols.length};min-width:${172 + cols.length * 116}px">${head}${rows}</div></div>
  </section>`;
}

function renderPlan(model, plan) {
  const outNames = [...state.out[model.date]];
  const res = plan.results;
  const n = s => res.filter(r => r.status === s).length;
  const covered = n('sub') + n('merge'), review = n('review'), none = n('none');
  const kids = res.reduce((a, r) => a + r.task.expected, 0);
  const span = res.length ? range(Math.min(...res.map(r => r.task.start)), Math.max(...res.map(r => r.task.end))) : '';
  const subsUsed = [...new Set(res.filter(r => r.status === 'sub').map(r => r.pick))];
  const unqualified = [...new Set(res.filter(r => r.status === 'sub' && !r.pick.levelExperience).map(r => r.pick.name))];
  const source = model.shiftDay ? 'Swim instructor shifts from your schedule file are used to see who is on site.' : (model.shiftLoaded ? `Your schedule file has no shifts for ${dateShort(model.date)}, so on-site times are estimated from lessons.` : 'On-site times are estimated from each instructor\'s first and last lesson. Import shift times for better suggestions.');
  const items = res.map(r => {
    const t = r.task;
    let body = '';
    if (r.status === 'sub') {
      const why = r.pick.source === 'shift' ? `On shift ${range(r.pick.interval[0], r.pick.interval[1])} with no lesson then.` : r.pick.source === 'edited' ? `On site ${range(r.pick.interval[0], r.pick.interval[1])} (edited) with no lesson then.` : 'Free between their own lessons (estimated).';
      body = `<div class="plan-answer" style="display:flex;align-items:center;gap:6px">${icon('ok', ' style="color:var(--ok)"')}<span><strong style="color:var(--text)">${h(r.pick.name)}</strong> substitutes</span></div><div class="plan-why">${h(why)}${r.pick.levelExperience ? '' : ` Hasn't taught ${h(t.title)} in this roster.`}</div>`;
    } else if (r.status === 'merge' || r.status === 'review') {
      const hst = r.pick.host;
      body = `<div class="plan-answer" style="display:flex;align-items:center;gap:6px">${icon(r.status === 'merge' ? 'ok' : 'warn', ` style="color:var(--${r.status === 'merge' ? 'ok' : 'warn'})"`)}<span>Merge into <strong style="color:var(--text)">${h(hst.instructor)}'s ${h(hst.title)}</strong></span></div><div class="plan-why">${plural(t.expected, 'kid')} join ${hst.expected}, making ${hst.expected + t.expected} of ${hst.capacity}.${r.status === 'review' ? ` PIVVIT listed this capacity for ${h(dateShort(hst.capacityDate))}. Check it before merging.` : ''}</div>`;
    } else {
      body = `<div class="plan-answer" style="display:flex;align-items:center;gap:6px;color:var(--danger)">${icon('xCircle')}<strong>Uncovered</strong></div><div class="plan-why">${h(r.reason)}</div>`;
    }
    const choices = r.options.map(o => `<option value="${h(o.key)}"${r.pick && r.pick.key === o.key ? ' selected' : ''}>${o.type === 'sub' ? h(o.name) + ' substitutes' : 'Merge into ' + h(o.name) + "'s class"}${o.type === 'merge' && !o.capacityValid ? ' (check capacity)' : ''}</option>`).join('');
    const select = r.options.length ? `<div class="plan-actions"><label class="sr-only" for="pick-${h(t.id)}">Choose coverage for ${h(t.title)} at ${h(clockText(t.start))}</label><select class="select" id="pick-${h(t.id)}" data-pick="${h(t.id)}" style="height:30px">${choices}<option value="none"${!r.pick ? ' selected' : ''}>Leave uncovered</option>${r.pinned ? '<option value="auto">Let the planner choose</option>' : ''}</select></div>` : '';
    return `<div class="plan-item" style="${r.status === 'none' ? 'background:#fffafa' : r.status === 'review' ? 'background:#fffaf0' : ''}">
      <div class="plan-line"><span class="plan-what">${h(t.title)} · ${plural(t.expected, 'kid')}${outNames.length > 1 ? ` <span class="muted" style="font-weight:450">(${h(t.instructor)})</span>` : ''}</span><span class="plan-time">${h(range(t.start, t.end))}</span></div>
      ${body}${select}</div>`;
  }).join('');
  const windows = plan.windows;
  const siteRows = model.people.filter(p => !outNames.includes(p.name)).map(p => {
    const w = windows[p.name] || { here: false, intervals: [], source: 'estimate' };
    const iv = w.intervals.length ? [Math.min(...w.intervals.map(x => x[0])), Math.max(...w.intervals.map(x => x[1]))] : [p.first ?? 540, p.last ?? 780];
    const src = { shift: 'From shift file', 'lessons-only': 'No shift on file: lessons only', estimate: 'Estimated from lessons', edited: 'Edited' }[w.source];
    return `<div class="site-row"><label class="check" style="margin:0"><input type="checkbox" data-site-here="${h(p.name)}"${w.here ? ' checked' : ''}><span style="font-weight:580;color:var(--text)">${h(p.name)}</span></label>
      <span class="hint">${h(src)}</span>
      <span style="display:flex;align-items:center;gap:6px"><input class="input" type="time" aria-label="${h(p.name)} on site from" data-site-start="${h(p.name)}" value="${timeInput(iv[0])}"><span class="muted">to</span><input class="input" type="time" aria-label="${h(p.name)} on site until" data-site-end="${h(p.name)}" value="${timeInput(iv[1])}"></span>
      ${w.source === 'edited' ? `<button class="btn btn-sm btn-ghost" type="button" data-site-reset="${h(p.name)}">Reset</button>` : '<span></span>'}</div>`;
  }).join('');
  return `<section class="panel plan-panel" aria-labelledby="plan-h" style="border-color:var(--border-strong)">
    <div class="panel-head" style="flex-wrap:wrap;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 id="plan-h">${h(nameJoin(outNames))} ${outNames.length === 1 ? 'is' : 'are'} out</h2>
          ${covered ? `<span class="badge badge-ok">${covered} covered</span>` : ''}${review ? `<span class="badge badge-warn">${review} to check</span>` : ''}${none ? `<span class="badge badge-danger">${none} uncovered</span>` : ''}</div>
        <div class="panel-sub" style="margin:0">${res.length ? `${plural(res.length, 'lesson')} and ${plural(kids, 'kid')}, ${h(span)}. ` : 'No lessons with kids to move. '}${plan.zero.length ? `${plural(plan.zero.length, 'empty lesson')} need${plan.zero.length === 1 ? 's' : ''} nothing. ` : ''}Suggestions only; nothing changes in PIVVIT.</div>
      </div>
      <div class="toolbar no-print">
        <div class="seg" role="group" aria-label="When both work"><button type="button" data-prefer="sub" aria-pressed="${state.prefer === 'sub'}">Prefer free instructor</button><button type="button" data-prefer="merge" aria-pressed="${state.prefer === 'merge'}">Prefer merging</button></div>
        <button class="btn" type="button" data-act="copy-plan">${icon('copy')}Copy plan</button>
        <button class="btn" type="button" data-act="print-plan">${icon('print')}Print plan</button>
        <button class="btn btn-ghost" type="button" data-act="clear-out">Clear call-outs</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:16px 20px 4px">
      <div class="callout">${icon(model.shiftDay ? 'calendar' : 'info', ' style="margin-top:2px"')}<div>${h(source)}</div></div>
      ${unqualified.length ? `<div class="callout callout-warn">${icon('warn', ' style="margin-top:2px"')}<div>${h(nameJoin(unqualified))} ${unqualified.length === 1 ? "isn't" : "aren't"} teaching some of these levels elsewhere in this roster. Confirm they're qualified before you assign them.</div></div>` : ''}
      ${plan.truncated ? `<div class="callout callout-danger">${icon('warn', ' style="margin-top:2px"')}<div>This day has too many combinations to check them all. The plan is a good one but may not be the best possible, so review the options.</div></div>` : ''}
    </div>
    ${res.length ? `<div class="plan plan-grid">${items}</div>` : ''}
    <details class="site no-print"><summary>Who's on site (${model.people.filter(p => !outNames.includes(p.name) && (windows[p.name] || {}).here).length})</summary>
      <div class="hint" style="padding:0 20px 8px">Untick anyone who isn't here, or change their hours. Changes only affect this plan.</div>
      ${siteRows}
      <div style="padding:10px 20px"><label class="check" style="margin:0"><input type="checkbox" data-act="empty-free"${state.emptyFree ? ' checked' : ''}> Instructors are free during classes with no kids</label></div>
    </details>
  </section>`;
}
const nameJoin = arr => arr.length <= 2 ? arr.join(' and ') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

  const instIn = active.filter(l => l.teacherStatus === 'present').length;

  const stale = state.day === todayIso() && r.savedAt && Date.now() - r.savedAt > 3 * 3600e3;

          ${r.dates.length > 1 ? `<label class="sr-only" for="dayPick">Choose date</label><select class="select no-print" id="dayPick">${r.dates.map(d => `<option value="${d}"${d === state.day ? ' selected' : ''}>${h(dateShort(d))}${d === todayIso() ? ' (today)' : ''}</option>`).join('')}</select>` : ''}
          ${state.day === todayIso() ? '<span class="badge badge-accent">Today</span>' : ''}
        </div>
      </div>
      <div class="toolbar no-print">

        <details class="menu"><summary class="btn btn-primary">${icon('userX')}Mark instructor out</summary><div class="menu-list" role="menu">${outMenu}</div></details>

        <span><b>${outKids}</b> reported out</span><span class="sep"></span>

        <span><b>${teaching.length}</b> ${teaching.length === 1 ? 'instructor' : 'instructors'} teaching${span ? ', ' + h(span) : ''}</span>

    ${stale ? `<div class="callout callout-warn">${icon('warn', ' style="margin-top:2px"')}<div>This roster was ${h(savedText(r.savedAt))}, over 3 hours ago. Save it again from PIVVIT to pick up new absences.</div></div>` : ''}
    ${plan ? renderPlan(model, plan) : ''}
    <section class="panel attn-panel" aria-labelledby="attn-h">
      <div class="panel-head"><div><h2 id="attn-h">Needs a look</h2><div class="panel-sub">Things in this roster worth checking.</div></div></div>
      <ul class="attn" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr))">
        ${items.map((it, i) => `<li${i === 1 ? ' style="border-top:0"' : ''}>${icon(toneIcon[it.tone], ` class="icon tone-${it.tone}"`).replace('class="icon"', '')}<div style="flex:1"><div class="attn-title">${h(it.title)}</div><div>${h(it.body)}</div></div>
          ${it.action ? `<button class="btn btn-sm" type="button" data-attn="${i}">${h(it.action.label)}</button>` : it.ids && it.ids.length ? `<button class="btn btn-sm" type="button" data-attn="${i}">Show</button>` : ''}</li>`).join('')}
      </ul>
    </section>
    ${model.lessons.length ? renderBoard(model, plan) : `<section class="panel"><div class="panel-body muted">No lessons on ${h(dateShort(state.day))} in this save.</div></section>`}

  state._items = items;
  state._plan = plan;

}

function render() {
  renderSidebar();

}

function closeEditor() { $('modal').hidden = true; $('modal').innerHTML = ''; state.editing = null; }
function saveEditor() {
  const c = state.roster.classes.find(x => x.id === state.editing);
  if (!c) return;
  const expected = Number($('edExpected').value), raw = $('edCapacity').value.trim(), capacity = raw ? Number(raw) : null;
  const err = msg => { $('edError').textContent = msg; $('edError').style.color = 'var(--danger)'; };
  if (!Number.isInteger(expected) || expected < 0 || expected > 200) return err('Expected kids must be a whole number from 0 to 200.');
  if (capacity !== null && (!Number.isInteger(capacity) || capacity < 0 || capacity > 200)) return err('Capacity must be a whole number from 0 to 200, or blank.');
  if (capacity !== null && capacity < expected) return err('Capacity cannot be lower than the expected kids.');
  const cur = lessonForDate(c, state.day);
  const ov = { ...(c.overrides[state.day] || {}), expected, canceled: $('edCanceled').checked };
  if (capacity !== (cur.capacity ?? null)) { ov.capacity = capacity; ov.capacityVerified = capacity !== null; }
  else ov.capacityVerified = $('edVerified').checked;
  c.overrides[state.day] = ov;
  closeEditor(); render(); toast('Lesson updated for this plan.');
}

/* =========================================================================
   Imports
   ========================================================================= */
async function importFiles(files) {
  for (const f of files) {
    if (/\.html?$/i.test(f.name)) await importRoster(f);
    else if (/\.xlsx$/i.test(f.name)) await importShifts(f);
    else toast(`${f.name} isn't a PIVVIT save (.html) or a schedule export (.xlsx).`, true);
  }
}
async function importRoster(file) {
  try {
    if (file.size > 30 * 1024 * 1024) throw Error('This file is over 30 MB. Save only the roster page.');
    const parsed = parseRoster(await file.text());
    const prev = state.roster;
    let diff = '';
    if (prev) {
      const byKey = new Map(prev.classes.map(c => [lessonKey(c), c]));
      for (const c of parsed.classes) { const old = byKey.get(lessonKey(c)); if (old) c.overrides = old.overrides; }
      const outAt = (cls, d) => cls.reduce((a, c) => a + (c.observations[d] ? c.observations[d].tally.flagged + c.observations[d].tally.excused : 0), 0);
      const d = parsed.dates.includes(state.day) ? state.day : null;
      if (d) { const delta = outAt(parsed.classes, d) - outAt(prev.classes, d); diff = delta > 0 ? ` ${plural(delta, 'new absence')} reported since your last save.` : delta < 0 ? ` ${plural(-delta, 'fewer absence', 'fewer absences')} than your last save.` : ' No new absences since your last save.'; }
      state.pins = {};
    }
    state.roster = { ...parsed, fileName: file.name, savedAt: file.lastModified || Date.now() };
    if (!parsed.dates.includes(state.day)) state.day = parsed.dates.includes(todayIso()) ? todayIso() : (parsed.dates.find(d => d >= todayIso()) || parsed.dates[parsed.dates.length - 1]);
    state.highlight.clear();
    render();
    toast(prev ? 'Roster updated.' + diff : `Roster loaded: ${plural(parsed.classes.length, 'class', 'classes')} across ${plural(parsed.dates.length, 'date')}.`);
  } catch (e) { toast('Could not read that roster. ' + e.message, true); }
}
async function importShifts(file) {
  try {
    if (file.size > 25e6) throw Error('This Excel file is over 25 MB.');
    const parsed = await parseShiftWorkbook(await file.arrayBuffer(), new Date(file.lastModified || Date.now()));
    state.shifts = { ...parsed, fileName: file.name };
    render();
    toast(`Shift times loaded: ${plural(parsed.count, 'swim instructor shift')} across ${plural(parsed.dates.length, 'day')}.`);
  } catch (e) { toast('Could not read that schedule. ' + e.message, true); }
}
function chooseFiles(accept) { const inp = $('fileInput'); inp.accept = accept; inp.value = ''; inp.click(); }

/* =========================================================================
   Copy & print
   ========================================================================= */
function planText() {
  const plan = state._plan;
  if (!plan) return '';
  const lines = [`Lesson coverage · ${dateTitle(state.day)}`, `Out: ${nameJoin([...state.out[state.day]])}`, ''];
  for (const r of plan.results) {
    const t = r.task, head = `${range(t.start, t.end)}  ${t.title} (${plural(t.expected, 'kid')})${state.out[state.day].size > 1 ? ' · ' + t.instructor : ''}`;
    const what = r.status === 'sub' ? `${r.pick.name} substitutes` : r.status === 'merge' ? `Merge into ${r.pick.name}'s class` : r.status === 'review' ? `Merge into ${r.pick.name}'s class (check capacity)` : 'UNCOVERED';
    lines.push(`${head}: ${what}`);
  }
  if (plan.zero.length) lines.push('', `No kids, nothing to move: ${plan.zero.map(l => clockShort(l.start) + ' ' + l.title).join(', ')}`);
  lines.push('', 'Suggestions only. Confirm qualifications and capacities before changing anything in PIVVIT.');
  return lines.join('\n');
}
async function copyPlan() {
  const text = planText();
  try { await navigator.clipboard.writeText(text); toast('Plan copied. Paste it into your group chat.'); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy'); ta.remove();
    toast(ok ? 'Plan copied.' : 'Copy failed. Use Print plan instead.', !ok);
  }
  state._lastCopied = text;
}
function printNow(planOnly) { document.body.classList.toggle('print-plan', !!planOnly); window.print(); setTimeout(() => document.body.classList.remove('print-plan'), 500); }

/* =========================================================================
   Toast
   ========================================================================= */
function toast(msg, bad = false) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false; t.style.background = bad ? 'var(--danger)' : '';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, bad ? 7000 : 4500);
}

/* =========================================================================
   Events
   ========================================================================= */
function setDay(d) { if (!state.roster || !state.roster.dates.includes(d)) return; state.day = d; state.highlight.clear(); render(); }
function toggleOut(name) {
  const set = state.out[state.day] || (state.out[state.day] = new Set());
  if (set.has(name)) set.delete(name); else set.add(name);
  state.pins[state.day] = {};
  render();
  if (set.has(name)) document.querySelector('.plan-panel')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function siteEdit(name, patch) {
  const model = state._model, w = windowsFor(model)[name];
  const all = state.siteEdits[state.day] || (state.siteEdits[state.day] = {});
  const iv = w && w.intervals.length ? [Math.min(...w.intervals.map(x => x[0])), Math.max(...w.intervals.map(x => x[1]))] : [540, 780];
  all[name] = { here: w ? w.here : true, start: iv[0], end: iv[1], ...(all[name] || {}), ...patch };
  render();
  const d = document.querySelector('details.site'); if (d) d.open = true;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-act]');
  if (!t) { document.querySelectorAll('details.menu[open]').forEach(d => d.removeAttribute('open')); return; }
  if (!t.closest('details.menu')) document.querySelectorAll('details.menu[open]').forEach(d => d.removeAttribute('open'));
  const act = t.dataset.act;
  if (act === 'import-roster') return chooseFiles('.html,.htm,text/html');
  if (act === 'import-shifts') return chooseFiles('.xlsx');
  if (act === 'import-any') return chooseFiles('.html,.htm,.xlsx,text/html');
  if (act === 'remove-shifts') { state.shifts = null; render(); return toast('Shift times removed.'); }
  if (act === 'copy-plan') return copyPlan();
  if (act === 'print-plan') return printNow(true);
  if (act === 'print-board') return printNow(false);
  if (act === 'clear-out') { state.out[state.day] = new Set(); state.pins[state.day] = {}; render(); return toast('Call-outs cleared for this date.'); }
  if (act === 'close-modal') return closeEditor();
  if (act === 'reset-lesson') { const c = state.roster.classes.find(x => x.id === state.editing); if (c) delete c.overrides[state.day]; closeEditor(); render(); return toast('Lesson reset to the PIVVIT values.'); }
  if (t.dataset.day) { const i = state.roster.dates.indexOf(state.day) + +t.dataset.day; return setDay(state.roster.dates[i]); }
  if (t.dataset.out) return toggleOut(t.dataset.out);
  if (t.dataset.prefer) { state.prefer = t.dataset.prefer; savePrefs(); return render(); }
  if (t.dataset.lesson) return openEditor(t.dataset.lesson);
  if (t.dataset.siteReset) { delete (state.siteEdits[state.day] || {})[t.dataset.siteReset]; render(); const d = document.querySelector('details.site'); if (d) d.open = true; return; }
  if (t.dataset.attn) {
    const it = state._items[+t.dataset.attn];
    if (!it) return;
    if (it.action && it.action.type === 'out') return toggleOut(it.action.name);
    if (it.action && it.action.type === 'verifyAll') { state.verifiedAll[state.day] = true; render(); return toast('Capacities marked as checked for this date.'); }
    if (it.action && it.action.type === 'import') return chooseFiles('.xlsx');
    state.highlight = new Set(it.ids || []);
    render();
    const first = document.querySelector('.lesson.hl'); if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
    clearTimeout(state._hlTimer);
    state._hlTimer = setTimeout(() => { state.highlight.clear(); document.querySelectorAll('.lesson.hl').forEach(x => x.classList.remove('hl')); }, 6000);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileInput') return importFiles([...t.files]);
  if (t.id === 'dayPick') return setDay(t.value);
  if (t.dataset.pick) {
    const pins = state.pins[state.day] || (state.pins[state.day] = {});
    if (t.value === 'auto') delete pins[t.dataset.pick]; else pins[t.dataset.pick] = t.value;
    return render();
  }
  if (t.dataset.act === 'empty-free') { state.emptyFree = t.checked; savePrefs(); render(); const d = document.querySelector('details.site'); if (d) d.open = true; return; }
  if (t.dataset.siteHere) return siteEdit(t.dataset.siteHere, { here: t.checked });
  if (t.dataset.siteStart) { const v = fromTimeInput(t.value); if (v != null) siteEdit(t.dataset.siteStart, { start: v, here: true }); return; }
  if (t.dataset.siteEnd) { const v = fromTimeInput(t.value); if (v != null) siteEdit(t.dataset.siteEnd, { end: v, here: true }); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'editForm') { e.preventDefault(); saveEditor(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('modal').hidden) closeEditor(); document.querySelectorAll('details.menu[open]').forEach(d => d.removeAttribute('open')); return; }
  if (!state.roster || !$('modal').hidden || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = state.roster.dates.indexOf(state.day) + (e.key === 'ArrowLeft' ? -1 : 1);
    if (state.roster.dates[i]) setDay(state.roster.dates[i]);
  }
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeEditor(); });
let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('overlay').hidden = false; } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('overlay').hidden = true; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('overlay').hidden = true; if (e.dataTransfer?.files?.length) importFiles([...e.dataTransfer.files]); });

render();

// Hooks for the automated tests (tests/). Not used by the page itself.
window.AquaticsCoverageTest = { parseRoster, iconStatus, excludesRegistration, parseShiftWorkbook, planCoverage, sameName, dailyLessons, dayModel, windowsFor, attentionItems, planText, state };
})();
</script>
</body>
